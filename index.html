<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4a3236">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ไทรน้อย">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>ไปรษณีย์ไทรน้อย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap">
<style>
:root{--r:#e8384f;--d:#2b1d22;--c:#fff7e6;--y:#ffd23f;--g:#4cd07d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#4a3236;font-family:Mali,'Sarabun',sans-serif;overflow:hidden;touch-action:none;color:var(--d);overscroll-behavior:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#lab,#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-50%);color:#fff;font-weight:700;white-space:nowrap;padding:0 .45em;border-radius:.5em;border:2px solid var(--d);line-height:1.35;opacity:.92}
.lb.lk{filter:grayscale(1);opacity:.7}
.lb.sign{background:none;border:0;color:var(--r);text-shadow:0 1px 0 #fff;padding:0}
.pop{position:absolute;transform:translate(-50%,0);font-weight:700;white-space:nowrap;text-shadow:-1px -1px 0 var(--d),1px -1px 0 var(--d),-1px 1px 0 var(--d),1px 1px 0 var(--d),0 2px 0 var(--d);animation:up 1.3s ease-out forwards}
.pop.g{color:#7dff9f}.pop.r{color:#ff7080}.pop.y{color:var(--y)}
h2{margin:0}.code small{font-size:12px}
.sum{text-align:left;min-width:150px;font-size:13px;padding:2px 6px}.sum ul{margin:6px 0 0;padding-left:16px;line-height:1.5}.sum b{color:var(--r)}
.money{font-size:34px;font-weight:700;color:#d98a00;line-height:1.1}.money.neg{color:#c92a3b}
.sat{height:9px;border:2px solid var(--d);border-radius:6px;background:#fff;overflow:hidden;margin:2px 0}.sat i{display:block;height:100%}
.bt{margin-top:6px;display:flex;flex-direction:column;align-items:stretch}.bt button{margin:3px 0}.bt p{text-align:center}
.fx{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:5px}.fx button{margin:0;font-size:13px;padding:2px 10px;border-width:2px;box-shadow:0 3px 0 var(--d)}.fx button:disabled{opacity:.5;box-shadow:none}
.ug{display:grid;grid-template-columns:repeat(3,128px);gap:6px}
.uc{border:3px solid var(--d);border-radius:10px;background:#fff;padding:3px 5px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:104px}
.uc.can{background:#e6ffe9}.uc.mx{background:#eee;opacity:.75}
.un{font-weight:700;font-size:13px;line-height:1.2}.uv{font-size:12px;margin:1px 0}.uv b{color:#2f9d57}.uc small{font-size:10px;line-height:1.15;opacity:.8}.uz{font-weight:700;font-size:12px;color:#2f9d57}
.uc button{margin:3px 0 0;padding:1px 10px;font-size:13px;border-width:2px;box-shadow:0 2px 0 var(--d)}.uc button:disabled{opacity:.5;box-shadow:none}
@keyframes up{0%{opacity:0;margin-top:6px}12%{opacity:1}100%{opacity:0;margin-top:-26px}}
#hud{position:fixed;top:max(5px,env(safe-area-inset-top));left:0;right:0;display:none;justify-content:flex-start;padding-left:max(10px,env(safe-area-inset-left));gap:5px;pointer-events:none;z-index:5;flex-wrap:wrap;max-width:calc(100vw - 205px)}
.pl{opacity:.85;background:var(--c);border:3px solid var(--d);border-radius:10px;box-shadow:0 3px 0 var(--d);padding:0 9px;font-weight:700;font-size:14px;line-height:22px}
#sc{background:#fff3a0}#sc.bad{background:#ffb3bb}#tkp.wait{background:#c8f5d5}.pl.soon{background:#ffe9a8}.pl.bad{background:#ffb3bb}
#toast{position:fixed;top:max(46px,calc(env(safe-area-inset-top) + 40px));left:50%;transform:translateX(-50%);display:none;z-index:9;pointer-events:none;background:#fff3a0;border:3px solid var(--d);border-radius:12px;box-shadow:0 3px 0 var(--d);padding:3px 14px;font-weight:700;font-size:14px;max-width:calc(100vw - 250px);text-align:center;line-height:1.3;animation:tin .3s ease-out}
#ban{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);display:none;z-index:9;pointer-events:none;max-width:90vw;text-align:center;background:linear-gradient(#fff3a0,#ffd23f);color:#2b1d22;border:4px solid var(--d);border-radius:14px;box-shadow:0 5px 0 var(--d);padding:8px 20px;font-size:clamp(15px,3.4vh + 3px,26px);font-weight:700;line-height:1.5;animation:banin 3s ease-out forwards}
#ban.r{background:linear-gradient(#ff8a96,#ff4d5e);color:#fff;text-shadow:0 2px 0 var(--d)}
@keyframes banin{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}8%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}14%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
#toast.r{background:#ffb3bb}
@keyframes tin{from{opacity:0;margin-top:-14px}to{opacity:1;margin-top:0}}
#hint{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:none;z-index:5;pointer-events:none;background:var(--y);border:3px solid var(--d);border-radius:12px;box-shadow:0 3px 0 var(--d);padding:3px 14px;font-weight:700;font-size:15px;max-width:calc(100vw - 250px);text-align:center;white-space:normal;line-height:1.25}
#hint small{display:block;font-size:11px;opacity:.75;margin-top:-2px}
#tools{position:fixed;top:max(5px,env(safe-area-inset-top));right:max(6px,env(safe-area-inset-right));display:none;gap:5px;z-index:8}
#tools button{opacity:.82;margin:0;padding:0;width:32px;height:32px;font-size:16px;border-radius:10px;border-width:3px;box-shadow:0 3px 0 var(--d)}
#tools button.off{opacity:.45}
#bv{display:none}body.vc #bv{display:block}
#tools button.on{background:#7dff9f;opacity:1}#tools button.sp{box-shadow:0 0 0 3px #3dff6a,0 0 10px 3px #3dff6a,0 3px 0 var(--d)}#tools button.busy{opacity:.6}
body.vc #hud{max-width:calc(100vw - 244px)}body.vc #toast,body.vc #hint{max-width:calc(100vw - 292px)}
.lb.nm.sp{box-shadow:0 0 0 2px #3dff6a,0 0 9px 3px #3dff6a}.lb.nm.sp::before{content:'🎙 '}
.sl .ch.sp{box-shadow:0 0 0 3px #3dff6a,0 0 10px 2px #3dff6a}.sl .ch.sp::after{content:' 🎙'}
button.vb.on{background:#7dff9f}
#jz{position:fixed;left:0;top:0;width:55%;bottom:0;z-index:6;display:none}
#jb{display:none;position:fixed;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.75);z-index:7;pointer-events:none}
#kb{position:absolute;left:24px;top:24px;width:42px;height:42px;border-radius:50%;background:#fff7e6;border:3px solid var(--d)}
#jh{position:fixed;left:max(24px,env(safe-area-inset-left));bottom:30px;width:96px;height:96px;border-radius:50%;border:3px dashed rgba(255,255,255,.35);z-index:4;pointer-events:none;display:none;color:rgba(255,255,255,.55);font-size:11px;align-items:center;justify-content:center;text-align:center}
#ab{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:100px;height:100px;border-radius:50%;z-index:6;display:none;align-items:center;justify-content:center;margin:0;padding:0;background:rgba(255,255,255,.2);border:4px solid rgba(255,255,255,.55);box-shadow:none}
#ab canvas{width:80px;height:80px;image-rendering:pixelated;pointer-events:none;opacity:.7;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
#ab.on{background:rgba(232,56,79,.62);border-color:rgba(255,255,255,.9)}#ab.on canvas{opacity:1}
#ab.on:not(.hold)::before{content:'';position:absolute;inset:-9px;border-radius:50%;border:3px solid rgba(255,210,63,.9);animation:pls .8s ease-in-out infinite alternate}
@keyframes pls{from{transform:scale(.95);opacity:.5}to{transform:scale(1.05);opacity:1}}
#ab.hold::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:4px dashed #fff;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#ab:active,#ab.dn{transform:scale(.93)}
#db{position:fixed;right:max(40px,calc(env(safe-area-inset-right) + 18px));bottom:calc(max(22px,env(safe-area-inset-bottom)) + 112px);width:68px;height:68px;border-radius:50%;z-index:6;display:none;align-items:center;justify-content:center;margin:0;padding:0;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.55);box-shadow:none}
#db canvas{width:48px;height:48px;image-rendering:pixelated;pointer-events:none;opacity:.85;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
#db:active,#db.dn{transform:scale(.93);background:rgba(232,56,79,.55);border-color:#fff}
#db.hl{background:rgba(232,56,79,.55);border-color:#fff;animation:pls2 .7s ease-in-out infinite alternate}
@keyframes pls2{from{box-shadow:0 0 0 0 rgba(255,210,63,.95)}to{box-shadow:0 0 0 8px rgba(255,210,63,0)}}
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(43,29,34,.82)}
.cd{background:var(--c);border:4px solid var(--d);border-radius:14px;box-shadow:0 6px 0 var(--d);padding:10px 16px;text-align:center;max-height:94vh;overflow:auto;max-width:94vw}
.row{display:flex;gap:14px;align-items:center;justify-content:center}
h1{margin:0;font-size:26px;color:var(--r);line-height:1.2}h2{margin:0;font-size:20px}p{margin:3px 0;font-size:13px}
button{font:inherit;font-weight:700;background:var(--r);color:#fff;border:3px solid var(--d);border-radius:12px;box-shadow:0 4px 0 var(--d);padding:5px 14px;margin:4px;font-size:15px;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--d)}
button.g{background:#fff;color:var(--d)}button.b{background:#3da5f5}button.k{background:var(--g);color:var(--d)}
button.big{font-size:17px;padding:7px 16px}
input::placeholder{letter-spacing:0;font-weight:500;font-size:13px}
input{font:inherit;font-weight:700;width:96px;text-align:center;letter-spacing:4px;text-transform:uppercase;border:3px solid var(--d);border-radius:12px;padding:5px;font-size:16px;-webkit-user-select:text;user-select:text}
.code{font-size:40px;font-weight:700;letter-spacing:8px;color:var(--r);line-height:1.1}
.sl{display:flex;gap:6px;justify-content:center;margin:6px 0}
.ch{border:3px solid var(--d);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;min-width:64px}
.how{text-align:left;font-size:13px;line-height:1.45;margin:6px 0}.how b{color:var(--r)}
.msg{color:#b5233b;min-height:17px;font-weight:700;font-size:13px}
#nm{width:150px;letter-spacing:0;text-transform:none;font-size:15px;margin:4px}
.nmr{display:flex;justify-content:center;align-items:center;flex-wrap:wrap}
.tabs{display:flex;justify-content:center;flex-wrap:wrap}.tabs button{padding:2px 12px;font-size:13px;margin:2px;border-width:2px;box-shadow:0 3px 0 var(--d)}
.bd{border-collapse:collapse;margin:4px auto;font-size:14px;min-width:250px}.bd td{padding:2px 7px;border-bottom:2px dashed rgba(0,0,0,.14);text-align:right;white-space:nowrap}
.bd td:first-child{text-align:center;min-width:28px}.bd td.bn{text-align:left;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.bd tr.me td{background:#fff3b0;font-weight:700}.bd tr.em td{text-align:center;color:#7a6a6e;padding:10px}
.tag{display:inline-block;background:var(--y);border:2px solid var(--d);border-radius:10px;padding:3px 9px 1px;font-size:12px;line-height:1.7;font-weight:700;margin-left:6px;vertical-align:middle;overflow:visible}
#rot{display:none;position:fixed;inset:0;z-index:50;background:#2b1d22;color:#fff7e6;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px}
@media(orientation:portrait){#rot{display:flex}}

/* ---------- หน้าแรก (ไตเติลสไตล์เกม PC) ---------- */
#ov.title{background:radial-gradient(ellipse at 28% 45%,rgba(255,210,63,.22),transparent 62%),radial-gradient(ellipse at 100% 100%,rgba(232,56,79,.25),transparent 55%),linear-gradient(180deg,rgba(32,20,26,.9),rgba(32,20,26,.97))}
#ov.title:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 14px,transparent 14px 28px);pointer-events:none}
#ov.title .cd{background:none;border:0;box-shadow:none;padding:0;width:100%;height:100%;max-width:none;max-height:none;overflow:hidden;color:#fff}
#ov.title .msg{position:absolute;left:0;right:0;bottom:6px;color:#ffd23f}
.ttl{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(14px,5vw,70px);width:100%;height:100%;padding:12px max(4vw,16px)}
.tl{flex:1 1 55%;min-width:0;display:flex;flex-direction:column;align-items:center}
.logo{text-align:center;transform:rotate(-2.5deg)}
.lg1{display:inline-block;font-size:clamp(9px,1.6vw,13px);font-weight:700;letter-spacing:.22em;color:#2b1d22;background:#ffd23f;border:3px solid #2b1d22;border-radius:8px;padding:0 10px;box-shadow:0 3px 0 #2b1d22;margin-bottom:clamp(2px,1vh,10px)}
.lth{font-size:clamp(28px,min(6.4vw,15vh),96px);font-weight:700;line-height:1.35;color:#fff7e6;white-space:nowrap;
 text-shadow:-3px -3px 0 #2b1d22,3px -3px 0 #2b1d22,-3px 3px 0 #2b1d22,3px 3px 0 #2b1d22,0 -3px 0 #2b1d22,0 3px 0 #2b1d22,-3px 0 0 #2b1d22,3px 0 0 #2b1d22,0 5px 0 #e8384f,0 8px 0 #2b1d22,3px 8px 0 #2b1d22,-3px 8px 0 #2b1d22,0 11px 0 #2b1d22}
.len{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:clamp(8px,2.2vh,16px)}
.len span{font-size:clamp(11px,min(2.6vw,4.4vh),24px);font-weight:700;letter-spacing:.2em;color:#fff;background:#e8384f;border:3px solid #2b1d22;border-radius:8px;padding:1px 14px;box-shadow:0 4px 0 #2b1d22;white-space:nowrap}
.len i{display:block;height:4px;width:clamp(14px,5vw,60px);background:#ffd23f;border-radius:2px;box-shadow:0 3px 0 #2b1d22}
.sub{margin:clamp(6px,2vh,16px) 0 0;font-size:clamp(11px,1.7vw,15px);color:#e9dccb}
.crew{display:flex;align-items:flex-end;justify-content:center;gap:clamp(0px,1vw,10px);margin-top:clamp(4px,2vh,16px);padding-bottom:6px;border-bottom:5px solid #5a3a40;width:min(100%,430px)}
.crew canvas{width:clamp(36px,min(7vw,13vh),72px);aspect-ratio:32/36;height:auto;image-rendering:pixelated}
.tr{flex:0 0 min(300px,40vw);display:flex;flex-direction:column;align-items:stretch;gap:clamp(4px,1.2vh,9px)}
.mb{margin:0;font-size:clamp(14px,2.4vh + 4px,19px);line-height:1.6;padding:clamp(6px,1.5vh,10px) 16px;text-align:left;background:linear-gradient(#fff7e6,#ffe3a8);color:#2b1d22;position:relative;transition:transform .08s}
.mb:hover,.mb:focus{transform:translateX(5px);background:linear-gradient(#fffbe8,#ffd23f)}
.mb:hover:after,.mb:focus:after{content:'◀';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:#e8384f}
.mb.gr{background:linear-gradient(#7fe8a4,#4cd07d)}.mb.rd{background:linear-gradient(#ff6f82,#e8384f);color:#fff}.mb.bl{background:linear-gradient(#6cbcff,#3da5f5);color:#fff;white-space:nowrap}
.jr{display:flex;gap:8px;align-items:stretch}.jr input{flex:1 1 auto;min-width:0;width:100%}.jr .mb{flex:0 0 auto;text-align:center}
.ttl input{font:inherit;font-weight:700;font-size:clamp(14px,2.4vh + 4px,19px);text-align:center;letter-spacing:.2em;text-transform:uppercase;border:3px solid #2b1d22;border-radius:12px;box-shadow:0 4px 0 #2b1d22;padding:0 8px;background:#fff;color:#2b1d22;-webkit-user-select:text;user-select:text}
.fsq{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));margin:0;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(255,247,230,.12);color:#fff7e6;border:3px solid #fff7e6;border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.5);opacity:.85}
.fsq:hover{opacity:1;background:#ffd23f;color:#2b1d22}
.ios{font-size:11px;color:#e9dccb;text-align:center}
@media (max-aspect-ratio:1/1){.ttl{flex-direction:column;justify-content:center}.tl{flex:0 0 auto}.tr{flex:0 0 auto;width:min(320px,86vw)}}
@media(max-height:420px){.ug{grid-template-columns:repeat(4,100px);gap:4px}.uc{padding:2px 3px 3px}.un{font-size:12px}.uc small{font-size:9.5px}.uc button{padding:1px 6px;font-size:12px}.cd{padding:6px 14px}h2{font-size:18px}.money{font-size:28px}.sum{font-size:12px;min-width:168px}.sum ul{line-height:1.3;margin-top:3px}.uc{min-height:96px}.bt{flex-direction:row;align-items:center;margin-top:4px}.bt button{margin:2px}.bt button.big{font-size:15px;padding:4px 10px;flex:1;white-space:nowrap}.bt button.g{padding:4px 10px;font-size:14px}.bt p{font-size:11px}.code{font-size:32px}}

/* ---------- เลือกตัวละคร ---------- */
/* หน้าเลือกตัวละคร: กว้างตามจอ (ตารางคอลัมน์เท่ากัน ไม่พึ่งขนาดเนื้อหา) · --k = ตัวคูณขยายพิกเซลของตัวละคร ตั้งโดย JS ให้พอดีจอพอดี ไม่ต้องเลื่อน */
#pk{width:auto;--k:2}
#pk h2{margin-bottom:calc(2px + var(--k)*1px);font-size:calc(14px + var(--k)*2px)}
.pcs{display:grid;grid-template-columns:repeat(5,calc(72px + var(--k)*14px));justify-content:center;gap:calc(4px + var(--k)*2px);margin:2px 0 calc(2px + var(--k)*1px)}
.pc{min-width:0;border:3px solid var(--d);border-radius:10px;background:#fff;padding:calc(var(--k)*1px) 3px calc(var(--k)*1px);display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;box-shadow:0 3px 0 var(--d);transition:transform .08s}
.pc canvas{width:calc(32px*var(--k));height:calc(30px*var(--k));image-rendering:pixelated;margin-bottom:1px}
.pc b{font-size:calc(11px + var(--k)*2px);line-height:1.15}
.pc.sel{background:#fff3a0;transform:translateY(-3px);box-shadow:0 6px 0 var(--d),0 0 0 3px var(--r)}
.pc.lk{background:#d8d2de;color:#4a4256}
.pc.lk.sel{background:#e4ddf0}
.lkm{font-size:calc(8px + var(--k)*1.5px);font-weight:700;margin-top:calc(var(--k)*5px);line-height:1.3}
.ps{display:grid;grid-template-columns:auto 1fr;gap:0 4px;align-items:center;margin-top:0;line-height:1.15;font-size:calc(7px + var(--k)*1.5px);font-weight:700;text-align:left}
.ps em{font-style:normal;display:flex;gap:1px}
.ps i{display:block;width:calc(1px + var(--k)*1px);height:calc(5px + var(--k)*1px);background:#e1d3bd;border:1px solid var(--d)}
.ps i.on{background:var(--r)}
.pb{display:flex;justify-content:center;align-items:center;margin-top:calc(var(--k)*2px)}
#pk .pb button{font-size:calc(11px + var(--k)*1.5px);padding:calc(2px + var(--k)*.8px) calc(8px + var(--k)*3px)}
.pc.tk{background:#d9d9de;cursor:not-allowed}.pc.tk canvas{filter:grayscale(1);opacity:.55}.pc.tk b{opacity:.55}
.tkm{margin-top:calc(var(--k)*3px);border:2px solid var(--d);border-radius:8px;padding:1px 6px;font-size:calc(8px + var(--k)*1.5px);font-weight:700;line-height:1.3}
.lb.nm{color:var(--d);font-size:10px;padding:0 .4em;border-width:2px;border-radius:.6em;opacity:.95;line-height:1.25}
.lb.nm.me{border-color:#fff;box-shadow:0 0 0 2px var(--d);font-weight:800}
.pc.nw{animation:pawin .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pawin{0%{transform:scale(.1) rotate(-14deg);opacity:0}100%{transform:translateY(-3px) scale(1) rotate(0);opacity:1}}
/* ---------- แป้นกดรหัสแบบโทรศัพท์พิกเซล ---------- */
#pad{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(20,12,24,.72)}
#phn{position:relative;width:204px;background:#4b3f66;padding:14px 14px 12px;box-shadow:0 -4px 0 0 var(--d),0 4px 0 0 var(--d),-4px 0 0 0 var(--d),4px 0 0 0 var(--d),0 10px 0 4px rgba(0,0,0,.4),inset 0 4px 0 #6d5f8c,inset 0 -5px 0 #342b49}
#pad.shk #phn{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}35%{transform:translateX(8px)}55%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
.spk{width:46px;height:5px;margin:0 auto 7px;background:#1e1830;box-shadow:inset 0 2px 0 #0e0a18}
#px{position:absolute;right:6px;top:-2px;margin:0;padding:0;width:24px;height:22px;font-size:11px;border-width:0;background:none;color:#d6cdf0;box-shadow:none}
#lcdw{background:#b9cf74;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 4px);padding:7px 6px 3px;margin:0 2px 10px;text-align:center;box-shadow:0 -3px 0 0 var(--d),0 3px 0 0 var(--d),-3px 0 0 0 var(--d),3px 0 0 0 var(--d),inset 0 3px 0 rgba(0,0,0,.18)}
#lcdw.bad{background-color:#d98a8a}#lcdw.ok{background-color:#e6ff9a}
#lcd{display:flex;gap:9px;justify-content:center;align-items:flex-end;height:25px}
#lcd canvas{width:15px;height:25px;image-rendering:pixelated}
#lcd i{display:block;width:15px;height:3px;background:#24331a;opacity:.55}
#lmsg{font-size:10.5px;font-weight:700;color:#24331a;margin-top:5px;line-height:1.2;min-height:13px}
#keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 10px;padding:0 2px}
.pkey{margin:0;padding:0;height:38px;border:0;border-radius:0;background:#fff7e6;color:var(--d);display:flex;align-items:center;justify-content:center;box-shadow:0 -3px 0 0 var(--d),0 3px 0 0 var(--d),-3px 0 0 0 var(--d),3px 0 0 0 var(--d),inset 0 -5px 0 rgba(0,0,0,.17),inset 0 3px 0 rgba(255,255,255,.7)}
.pkey canvas{image-rendering:pixelated;pointer-events:none}
.pkey:active{transform:translateY(3px);box-shadow:0 -3px 0 0 var(--d),0 3px 0 0 var(--d),-3px 0 0 0 var(--d),3px 0 0 0 var(--d),inset 0 2px 0 rgba(0,0,0,.2)}
.pkey.okk{background:#7fe39c}.pkey.bk{background:#ffb3a0}
.ptx{margin-top:8px;font-size:9px;color:#b4a9d4;text-align:center;letter-spacing:.5px}

#phn{width:176px;padding:9px 12px 8px}.pkey{height:30px}.pkey canvas{height:17px;width:auto}#keys{gap:7px 9px}#lcdw{margin-bottom:7px}.spk{margin-bottom:4px}.ptx{display:none}}
